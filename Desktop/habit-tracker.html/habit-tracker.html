<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .summary-card-label {
      font-size: 12px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .summary-card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #2c3e50;
    }

    .form-section {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .form-section h2 {
      font-size: 1.25rem;
      color: #2c3e50;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button[type="submit"]:hover {
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    .error-container {
      min-height: 24px;
      margin-bottom: 1rem;
    }

    .error-message {
      display: none;
      background: #fee;
      color: #c00;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 14px;
      border-left: 4px solid #c00;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .habits-list {
      display: grid;
      gap: 1rem;
    }

    .habit-item {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transition: background 0.2s;
    }

    .habit-item.done {
      background: #f0f8f5;
    }

    .habit-checkbox {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit-content {
      flex: 1;
    }

    .habit-name {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }

    .habit-item.done .habit-name {
      text-decoration: line-through;
      color: #95a5a6;
    }

    .habit-meta {
      display: flex;
      gap: 1rem;
      font-size: 13px;
      color: #7f8c8d;
      flex-wrap: wrap;
    }

    .habit-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .category-health { background: #d5f4e6; color: #27ae60; }
    .category-fitness { background: #ffeef0; color: #e74c3c; }
    .category-learning { background: #e3f2fd; color: #3498db; }
    .category-work { background: #f1f5fe; color: #2c3e50; }
    .category-other { background: #f5f5f5; color: #7f8c8d; }

    .habit-stats {
      display: flex;
      gap: 2rem;
      font-size: 13px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .streak-number {
      font-weight: 700;
      color: #e67e22;
    }

    .target-number {
      font-weight: 600;
      color: #3498db;
    }

    .delete-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: #ecf0f1;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e74c3c;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #ffeef0;
    }

    .delete-btn:active {
      transform: scale(0.95);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #7f8c8d;
      font-size: 16px;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.75rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .summary-card-value {
        font-size: 1.5rem;
      }

      .habit-item {
        flex-wrap: wrap;
      }

      .habit-stats {
        width: 100%;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 Habit Tracker</h1>
    </header>

    <div class="summary">
      <div class="summary-card">
        <div class="summary-card-label">Total Habits</div>
        <div class="summary-card-value" id="total-habits">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">Done Today</div>
        <div class="summary-card-value" id="done-today">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">Completion %</div>
        <div class="summary-card-value" id="completion-percent">0%</div>
      </div>
    </div>

    <div class="form-section">
      <h2>Add a New Habit</h2>
      <div class="error-container">
        <div class="error-message" id="error-message"></div>
      </div>
      <form id="habit-form">
        <div class="form-group">
          <label for="habit-name">Habit Name</label>
          <input
            type="text"
            id="habit-name"
            placeholder="e.g., Morning Run, Read 30 minutes"
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="habit-target">Target (days per week)</label>
            <input
              type="number"
              id="habit-target"
              min="1"
              max="7"
              placeholder="1"
              required
            >
          </div>

          <div class="form-group">
            <label for="habit-category">Category</label>
            <select id="habit-category" required>
              <option value="">-- Select a category --</option>
              <option value="health">Health</option>
              <option value="fitness">Fitness</option>
              <option value="learning">Learning</option>
              <option value="work">Work</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <button type="submit">Add Habit</button>
      </form>
    </div>

    <div id="habits-container"></div>
  </div>

  <script>
    let habits = [];
    let nextId = 1;

    const form = document.getElementById('habit-form');
    const errorMessageEl = document.getElementById('error-message');
    const habitsContainer = document.getElementById('habits-container');

    const habitNameInput = document.getElementById('habit-name');
    const habitTargetInput = document.getElementById('habit-target');
    const habitCategoryInput = document.getElementById('habit-category');

    form.addEventListener('submit', handleFormSubmit);

    function handleFormSubmit(e) {
      e.preventDefault();
      const isValid = validateForm();
      if (isValid) {
        addHabit();
        form.reset();
        clearErrorMessage();
      }
    }

    function validateForm() {
      const name = habitNameInput.value.trim();
      const target = parseInt(habitTargetInput.value);
      const category = habitCategoryInput.value;

      if (name.length < 3) {
        showErrorMessage('Habit name must be at least 3 characters long.');
        return false;
      }

      if (isNaN(target) || target < 1 || target > 7) {
        showErrorMessage('Target must be a whole number between 1 and 7.');
        return false;
      }

      if (!category) {
        showErrorMessage('Please select a category.');
        return false;
      }

      return true;
    }

    function showErrorMessage(message) {
      errorMessageEl.textContent = message;
      errorMessageEl.classList.add('show');
    }

    function clearErrorMessage() {
      errorMessageEl.classList.remove('show');
      errorMessageEl.textContent = '';
    }

    function addHabit() {
      const habit = {
        id: nextId++,
        name: habitNameInput.value.trim(),
        category: habitCategoryInput.value,
        target: parseInt(habitTargetInput.value),
        streak: 0,
        doneToday: false,
      };

      habits.push(habit);
      renderHabits();
      updateSummary();
    }

    function deleteHabit(id) {
      habits = habits.filter(h => h.id !== id);
      renderHabits();
      updateSummary();
    }

    function toggleHabit(id) {
      const habit = habits.find(h => h.id === id);
      if (habit) {
        habit.doneToday = !habit.doneToday;
        if (habit.doneToday) {
          habit.streak += 1;
        } else {
          habit.streak = Math.max(0, habit.streak - 1);
        }
        renderHabits();
        updateSummary();
      }
    }

    function renderHabits() {
      habitsContainer.innerHTML = '';

      if (habits.length === 0) {
        habitsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">✨</div>
            <p>No habits yet. Add one to get started!</p>
          </div>
        `;
        return;
      }

      const habitsList = document.createElement('div');
      habitsList.className = 'habits-list';

      habits.forEach(habit => {
        const habitItem = document.createElement('div');
        habitItem.className = `habit-item ${habit.doneToday ? 'done' : ''}`;

        const categoryClass = `category-${habit.category}`;

        habitItem.innerHTML = `
          <input
            type="checkbox"
            class="habit-checkbox"
            ${habit.doneToday ? 'checked' : ''}
            aria-label="Mark ${habit.name} as done"
          >
          <div class="habit-content">
            <div class="habit-name">${escapeHtml(habit.name)}</div>
            <div class="habit-meta">
              <span class="habit-badge ${categoryClass}">
                ${capitalize(habit.category)}
              </span>
            </div>
          </div>
          <div class="habit-stats">
            <div class="stat">
              🔥 <span class="streak-number">${habit.streak}</span>
            </div>
            <div class="stat">
              Target: <span class="target-number">${habit.target}x/week</span>
            </div>
          </div>
          <button class="delete-btn" aria-label="Delete ${habit.name}">
            ✕
          </button>
        `;

        const checkbox = habitItem.querySelector('.habit-checkbox');
        checkbox.addEventListener('change', () => toggleHabit(habit.id));

        const deleteBtn = habitItem.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => deleteHabit(habit.id));

        habitsList.appendChild(habitItem);
      });

      habitsContainer.appendChild(habitsList);
    }

    function updateSummary() {
      const total = habits.length;
      const doneCount = habits.filter(h => h.doneToday).length;
      const percentage = total === 0 ? 0 : Math.round((doneCount / total) * 100);

      document.getElementById('total-habits').textContent = total;
      document.getElementById('done-today').textContent = doneCount;
      document.getElementById('completion-percent').textContent = percentage + '%';
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    renderHabits();
    updateSummary();
  </script>
</body>
</html>
