
name: Java CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Compile all Java files
      run: |
        cd src/main/java
        javac com/mycompany/loginsystem/*.java
    
    - name: Run Login Tests
      run: |
        cd src/main/java
        java com.mycompany/loginsystem.LoginTest
    
    - name: Run Part 3 Tests
      run: |
        cd src/main/java
        java com.mycompany.loginsystem.messagePart3Test
