name: Java CI

on:
  push:
    branches: [ main, MessageFeature ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile all Java files
      run: javac com/mycompany/loginsystem/*.java

    - name: Run Login Tests
      run: java com.mycompany.loginsystem.LoginTest

    - name: Run Message Tests
      run: java com.mycompany.loginsystem.MessageTest
